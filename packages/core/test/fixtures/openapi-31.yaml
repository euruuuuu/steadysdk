openapi: 3.1.0
info:
  title: Features 3.1
  version: 2.0.0
servers:
  - url: https://api.example.com
paths:
  /things/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: verbose
        in: query
        schema: { type: boolean }
    get:
      operationId: getThing
      parameters:
        - name: verbose
          in: query
          description: Operation-level parameter wins.
          schema: { type: integer }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thing' }
webhooks:
  newThing:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Thing' }
      responses:
        '200': { description: ok }
components:
  schemas:
    Thing:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        label: { type: [string, 'null'] }
        kind: { const: thing }
        score: { type: [integer, string] }
        tags:
          type: array
          items: { type: string }
        parent:
          $ref: '#/components/schemas/Thing'
          description: The parent thing.
        extra:
          allOf:
            - $ref: '#/components/schemas/Extra'
          description: Wrapped in allOf to carry a description.
    Extra:
      type: object
      additionalProperties: { type: number }
