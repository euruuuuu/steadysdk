openapi: 3.0.3
info:
  title: Swagger Petstore
  version: 1.1.0
  description: A sample pet store API used to demonstrate sdkgen. Version 1.1.0, used for the changelog example.
servers:
  - url: https://petstore.example.com/{basePath}
    variables:
      basePath:
        default: v2
tags:
  - name: pets
    description: Everything about your pets.
  - name: store
    description: Access to petstore orders.
  - name: users
    description: Operations about users.
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      tags: [pets]
      summary: List all pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          required: true
          description: How many items to return at one time (max 100).
          schema:
            type: integer
            format: int32
            maximum: 100
        - name: status
          in: query
          description: Only return pets with these statuses.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PetStatus'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: A paged array of pets.
          headers:
            x-next:
              description: A link to the next page of responses.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pets'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [pets]
      summary: Create a pet
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: The created pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default:
          $ref: '#/components/responses/Error'
  /pets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The id of the pet.
        schema:
          type: integer
          format: int64
    get:
      tags: [pets]
      summary: Info for a specific pet
      operationId: showPetById
      responses:
        '200':
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [pets]
      summary: Update a pet
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                tag:
                  type: string
                  nullable: true
                status:
                  $ref: '#/components/schemas/PetStatus'
      responses:
        '200':
          description: The updated pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}/photo:
    post:
      tags: [pets]
      summary: Upload a photo of a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
      responses:
        '200':
          description: Upload result.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
                  sizeBytes:
                    type: integer
  /store/inventory:
    get:
      tags: [store]
      summary: Returns pet inventories by status
      operationId: getInventory
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
  /store/orders:
    get:
      tags: [store]
      summary: List orders
      operationId: listOrders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [placed, approved]
      responses:
        '200':
          description: Orders, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /store/orders/{orderId}:
    get:
      tags: [store]
      summary: Find purchase order by ID
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found.
  /store/orders/{orderId}/cancel:
    post:
      tags: [store]
      summary: Cancel an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cancelled.
  /users/login:
    post:
      tags: [users]
      summary: Log a user into the system
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Session token.
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      summary: Service health check
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      description: Correlation id echoed back by the server.
      schema:
        type: string
  responses:
    Error:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PetStatus:
      type: string
      description: Pet status in the store.
      enum: [available, pending, sold, archived]
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tag:
          type: string
        status:
          $ref: '#/components/schemas/PetStatus'
        birthDate:
          type: string
          format: date
    Pet:
      description: A pet in the store.
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
            createdAt:
              type: string
              format: date-time
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: '#/components/schemas/Pet'
    Order:
      type: object
      required: [id, petId, quantity]
      properties:
        id:
          type: string
          format: uuid
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          default: 1
        shipDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          description: Order status.
          enum: [placed, approved]
        payment:
          oneOf:
            - $ref: '#/components/schemas/CardPayment'
            - $ref: '#/components/schemas/CashPayment'
          discriminator:
            propertyName: method
    CardPayment:
      type: object
      required: [method, last4]
      properties:
        method:
          type: string
          enum: [card]
        last4:
          type: string
    CashPayment:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [cash]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
