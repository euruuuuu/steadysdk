name: Real-world specs

# Generates SDKs for large public specs (GitHub, Stripe, OpenAI, Twilio, Kubernetes), pinned to commits,
# and type-checks them strictly. Too slow and download-heavy for every push, so it runs weekly and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  real-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run --silent test:real-world >> "$GITHUB_STEP_SUMMARY"
